<svg viewBox="0 0 600 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Search Bar Component Template -->
  <!-- Modern, clean search bar with AI assistant hint -->
  
  <defs>
    <filter id="searchShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Search bar container -->
  <rect x="0" y="0" width="600" height="80" rx="16" fill="#FFFFFF" filter="url(#searchShadow)"/>
  
  <!-- Border -->
  <rect x="0" y="0" width="600" height="80" rx="16" fill="none" stroke="#2FA4A9" stroke-width="2" opacity="0.3"/>
  
  <!-- Search icon -->
  <g transform="translate(24, 28)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#2FA4A9" stroke-width="2.5"/>
    <line x1="19" y1="19" x2="26" y2="26" stroke="#2FA4A9" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Placeholder text -->
  <text x="70" y="46" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#A39A8E">
    Ask me anything about Türkiye... "Best beaches in Bodrum?"
  </text>
  
  <!-- AI badge -->
  <g transform="translate(520, 24)">
    <rect x="0" y="0" width="60" height="32" rx="8" fill="#1F6FAF" opacity="0.1"/>
    <text x="30" y="21" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1F6FAF" text-anchor="middle">
      AI
    </text>
  </g>
</svg>

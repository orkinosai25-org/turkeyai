<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept 2: Bougainvillea-Inspired Compass Navigation -->
  <!-- Floral petals forming a compass rose, feminine and Mediterranean -->
  
  <!-- Logo Mark: Flower compass -->
  <g id="mark">
    <!-- Four main petals as compass points (N, S, E, W) -->
    <ellipse cx="60" cy="35" rx="8" ry="18" fill="#C93A6A" opacity="0.8" transform="rotate(0 60 60)"/>
    <ellipse cx="85" cy="60" rx="8" ry="18" fill="#E89BA5" opacity="0.8" transform="rotate(90 60 60)"/>
    <ellipse cx="60" cy="85" rx="8" ry="18" fill="#F2A38A" opacity="0.8" transform="rotate(180 60 60)"/>
    <ellipse cx="35" cy="60" rx="8" ry="18" fill="#C93A6A" opacity="0.7" transform="rotate(270 60 60)"/>
    
    <!-- Diagonal petals (NE, SE, SW, NW) -->
    <ellipse cx="75" cy="45" rx="6" ry="14" fill="#E89BA5" opacity="0.6" transform="rotate(45 60 60)"/>
    <ellipse cx="75" cy="75" rx="6" ry="14" fill="#F2A38A" opacity="0.6" transform="rotate(135 60 60)"/>
    <ellipse cx="45" cy="75" rx="6" ry="14" fill="#C93A6A" opacity="0.6" transform="rotate(225 60 60)"/>
    <ellipse cx="45" cy="45" rx="6" ry="14" fill="#E89BA5" opacity="0.6" transform="rotate(315 60 60)"/>
    
    <!-- Center -->
    <circle cx="60" cy="60" r="10" fill="#1F6FAF"/>
    <circle cx="60" cy="60" r="4" fill="#F8F9F7"/>
  </g>
  
  <!-- Wordmark -->
  <g id="wordmark" transform="translate(110, 0)">
    <text x="0" y="50" font-family="Inter, sans-serif" font-size="36" font-weight="600" fill="#1F1D1B" letter-spacing="-0.5">
      Turkiy<tspan fill="#C93A6A">AI</tspan> Holidays
    </text>
    <text x="0" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#7A7267" letter-spacing="0.5">
      AI Knows Turkey Better
    </text>
  </g>
</svg>

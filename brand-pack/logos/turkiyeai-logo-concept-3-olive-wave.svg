<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept 3: Olive Leaf + Wave Abstract Monogram -->
  <!-- Combining olive branch (peace, wisdom) with Aegean waves -->
  
  <!-- Logo Mark -->
  <g id="mark">
    <!-- Olive leaves forming T shape -->
    <ellipse cx="45" cy="45" rx="15" ry="6" fill="#6F7F4C" opacity="0.9" transform="rotate(-30 45 45)"/>
    <ellipse cx="55" cy="40" rx="15" ry="6" fill="#6F7F4C" opacity="0.85" transform="rotate(-15 55 40)"/>
    <ellipse cx="65" cy="37" rx="15" ry="6" fill="#6F7F4C" opacity="0.8" transform="rotate(0 65 37)"/>
    <ellipse cx="75" cy="40" rx="15" ry="6" fill="#6F7F4C" opacity="0.85" transform="rotate(15 75 40)"/>
    <ellipse cx="85" cy="45" rx="15" ry="6" fill="#6F7F4C" opacity="0.9" transform="rotate(30 85 45)"/>
    
    <!-- Central stem -->
    <rect x="63" y="40" width="4" height="30" rx="2" fill="#6F7F4C"/>
    
    <!-- Wave at bottom -->
    <path d="M 35 70 Q 45 65, 50 70 T 65 70 T 80 70 T 95 70" 
          stroke="#2FA4A9" 
          stroke-width="4" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.9"/>
    <path d="M 35 78 Q 45 73, 50 78 T 65 78 T 80 78 T 95 78" 
          stroke="#1F6FAF" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.7"/>
  </g>
  
  <!-- Wordmark -->
  <g id="wordmark" transform="translate(120, 0)">
    <text x="0" y="50" font-family="Inter, sans-serif" font-size="36" font-weight="600" fill="#1F1D1B" letter-spacing="-0.5">
      Turkiy<tspan fill="#2FA4A9">AI</tspan> Holidays
    </text>
    <text x="0" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#7A7267" letter-spacing="0.5">
      AI Knows Turkey Better
    </text>
  </g>
</svg>

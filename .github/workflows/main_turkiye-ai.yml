# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - turkiye-ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build React client
        run: npm run build
        working-directory: client
        env:
          CI: false

      - name: Install server dependencies
        run: npm ci --omit=dev
        working-directory: server

      - name: Assemble deployment package
        run: |
          mkdir -p deploy_package
          cp index.js deploy_package/
          cp package.json deploy_package/
          cp -r server deploy_package/
          mkdir -p deploy_package/client/build
          cp -r client/build/* deploy_package/client/build/
          cd deploy_package && zip -r ../deploy.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B9A89F91246E4244ABE1437FFF05D31F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_754C25E03571446580D58627FC2541AA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_515FAF60443D4F95B136C2376D92DE21 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'turkiye-ai'
          slot-name: 'Production'
          package: deploy.zip

# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Required GitHub Secrets:
#   AZURE_WEBAPP_PUBLISH_PROFILE – Download from Azure Portal → Web App (turkaiholidays) → Get publish profile
#
# Optional GitHub Secrets (set as Azure App Service Application Settings):
#   HOTELBEDS_API_KEY        – HotelBeds API key (from developer.hotelbeds.com dashboard)
#   HOTELBEDS_API_SECRET     – HotelBeds API secret
#   AZURE_OPENAI_ENDPOINT    – Azure OpenAI endpoint URL
#   AZURE_OPENAI_API_KEY     – Azure OpenAI API key
#   AZURE_SEARCH_ENDPOINT    – Azure AI Search endpoint URL
#   AZURE_SEARCH_API_KEY     – Azure AI Search API key

name: Build and deploy Node.js app to Azure Web App - turkaiholidays

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build React client
        run: npm run build
        working-directory: client
        env:
          CI: false

      - name: Install server dependencies
        run: npm ci --omit=dev
        working-directory: server

      - name: Assemble deployment package
        run: |
          mkdir -p deploy_package
          cp index.js deploy_package/
          cp package.json deploy_package/
          cp -r server deploy_package/
          mkdir -p deploy_package/client/build
          cp -r client/build/* deploy_package/client/build/
          cd deploy_package && zip -r ../deploy.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'turkaiholidays'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip

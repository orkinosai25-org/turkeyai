# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Required GitHub Secrets:
#   AZURE_WEBAPP_PUBLISH_PROFILE – Download from Azure Portal → Web App → Get publish profile
#
# Optional GitHub Secrets (configure Azure OpenAI / settings; requires AZURE_CREDENTIALS):
#   AZURE_CREDENTIALS            – Azure service principal JSON for az login
#   SETTINGS_API_TOKEN           – GitHub PAT with contents:read on orkinosai-website (private repo)
#   AZURE_OPENAI_ENDPOINT        – Direct Azure OpenAI endpoint (fallback if website settings fail)
#   AZURE_OPENAI_API_KEY         – Direct Azure OpenAI API key
#   AZURE_OPENAI_DEPLOYMENT_NAME – Deployment name (default: gpt-4o)
#   AZURE_OPENAI_API_VERSION     – API version (default: 2024-08-01-preview)
#   AZURE_SEARCH_ENDPOINT        – Azure AI Search endpoint
#   AZURE_SEARCH_API_KEY         – Azure AI Search API key

name: Build and deploy Node.js app to Azure Web App - turkai

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build React client
        run: npm run build
        working-directory: client
        env:
          CI: false

      - name: Install server dependencies
        run: npm ci --omit=dev
        working-directory: server

      - name: Assemble deployment package
        run: |
          mkdir -p deploy_package
          cp index.js deploy_package/
          cp package.json deploy_package/
          cp -r server deploy_package/
          mkdir -p deploy_package/client/build
          cp -r client/build/* deploy_package/client/build/
          cd deploy_package && zip -r ../deploy.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'turkai'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip

      # ── Configure App Service Application Settings ──────────────────────────
      # Runs only when AZURE_CREDENTIALS is configured as a GitHub secret.
      # Populates the Azure App Service environment with the credentials needed
      # for the chat agent (Azure OpenAI) and settings provider (SETTINGS_API_TOKEN).
      - name: Log in to Azure (for App Settings)
        if: secrets.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service Application Settings
        if: secrets.AZURE_CREDENTIALS != ''
        uses: azure/appservice-settings@v1
        with:
          app-name: 'turkai'
          app-settings-json: |
            [
              { "name": "SETTINGS_API_TOKEN",           "value": "${{ secrets.SETTINGS_API_TOKEN }}",           "slotSetting": false },
              { "name": "AZURE_OPENAI_ENDPOINT",        "value": "${{ secrets.AZURE_OPENAI_ENDPOINT }}",        "slotSetting": false },
              { "name": "AZURE_OPENAI_API_KEY",         "value": "${{ secrets.AZURE_OPENAI_API_KEY }}",         "slotSetting": false },
              { "name": "AZURE_OPENAI_DEPLOYMENT_NAME", "value": "${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}", "slotSetting": false },
              { "name": "AZURE_OPENAI_API_VERSION",     "value": "${{ secrets.AZURE_OPENAI_API_VERSION }}",     "slotSetting": false },
              { "name": "AZURE_SEARCH_ENDPOINT",        "value": "${{ secrets.AZURE_SEARCH_ENDPOINT }}",        "slotSetting": false },
              { "name": "AZURE_SEARCH_API_KEY",         "value": "${{ secrets.AZURE_SEARCH_API_KEY }}",         "slotSetting": false }
            ]
          